# /etc/pkgaudit.conf — налаштування pkgaudit (ЛР 9).
# Формат: ключ = значення; рядки з # — коментарі.

# База dpkg, яку читає pkgaudit.
status = /var/lib/dpkg/status

# Куди snapshot і diff пишуть і звідки читають знімок за замовчуванням.
snapshot = /var/lib/pkgaudit/snapshot

# Пакети, які ніколи не показувати серед «листків», хоч би від них
# ніщо не залежало: їх установлено свідомо.
keep = openssh-server sudo
